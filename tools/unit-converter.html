<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta property="og:title" content="Tools DZ">
    <meta property="og:description" content="منصة أدوات رقمية مجانية">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "تحويل الوحدات",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "All"
    }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل الوحدات - Tools DZ</title>
    <meta name="description" content="أداة شاملة لتحويل الأطوال، الأوزان، المساحات والحرارة.">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/tools.css">
</head>
<body>
    <header id="main-header">
        <div class="container">
            <div class="logo">
                <a href="../index.html">
                    <h1>Tools DZ</h1>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-page-container">
            <div class="tool-header">
                <h2>تحويل الوحدات 📏</h2>
                <p>حول بين وحدات الطول، الوزن، المساحة، والحرارة.</p>
            </div>

            <div class="tool-wrapper">
                <div class="form-group">
                    <label>نوع التحويل</label>
                    <select id="conversion-type">
                        <option value="length">الطول</option>
                        <option value="weight">الوزن</option>
                        <option value="area">المساحة</option>
                        <option value="temperature">الحرارة</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center; margin-top: 20px;">
                    <div>
                        <input type="number" id="input-val" value="1" class="form-group" style="width: 100%; margin-bottom: 5px;">
                        <select id="input-unit" class="form-group" style="width: 100%;"></select>
                    </div>
                    <div style="text-align: center; font-size: 1.5rem; color: var(--primary-color);"> = </div>
                    <div>
                        <input type="number" id="output-val" readonly class="form-group" style="width: 100%; margin-bottom: 5px; background: var(--bg-color);">
                        <select id="output-unit" class="form-group" style="width: 100%;"></select>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const units = {
            length: {
                m: { name: 'متر', factor: 1 },
                km: { name: 'كيلومتر', factor: 1000 },
                cm: { name: 'سنتيمتر', factor: 0.01 },
                mm: { name: 'ميليمتر', factor: 0.001 },
                inch: { name: 'بوصة (Inch)', factor: 0.0254 },
                foot: { name: 'قدم (Foot)', factor: 0.3048 }
            },
            weight: {
                kg: { name: 'كيلوغرام', factor: 1 },
                g: { name: 'غرام', factor: 0.001 },
                mg: { name: 'ميليغرام', factor: 0.000001 },
                t: { name: 'طن', factor: 1000 },
                lb: { name: 'باوند (Pound)', factor: 0.453592 },
                oz: { name: 'أونصة (Ounce)', factor: 0.0283495 }
            },
            area: {
                sqm: { name: 'متر مربع', factor: 1 },
                sqkm: { name: 'كيلومتر مربع', factor: 1000000 },
                ha: { name: 'هكتار', factor: 10000 },
                acre: { name: 'فدان (Acre)', factor: 4046.86 }
            }
        };

        const typeSelect = document.getElementById('conversion-type');
        const inputUnit = document.getElementById('input-unit');
        const outputUnit = document.getElementById('output-unit');
        const inputVal = document.getElementById('input-val');
        const outputVal = document.getElementById('output-val');

        function populateUnits(type) {
            inputUnit.innerHTML = '';
            outputUnit.innerHTML = '';

            if (type === 'temperature') {
                const tempOptions = `
                    <option value="c">درجة مئوية (Celsius)</option>
                    <option value="f">فهرنهايت (Fahrenheit)</option>
                    <option value="k">كلفن (Kelvin)</option>
                `;
                inputUnit.innerHTML = tempOptions;
                outputUnit.innerHTML = tempOptions;
                outputUnit.selectedIndex = 1;
            } else {
                for (let key in units[type]) {
                    const opt1 = new Option(units[type][key].name, key);
                    const opt2 = new Option(units[type][key].name, key);
                    inputUnit.add(opt1);
                    outputUnit.add(opt2);
                }
                if (outputUnit.options.length > 1) {
                    outputUnit.selectedIndex = 1;
                }
            }
            calculate();
        }

        function calculate() {
            const val = parseFloat(inputVal.value);
            if (isNaN(val)) {
                outputVal.value = '';
                return;
            }

            const type = typeSelect.value;
            const inU = inputUnit.value;
            const outU = outputUnit.value;

            if (type === 'temperature') {
                let celsius;
                // Convert to Celsius first
                if (inU === 'c') celsius = val;
                else if (inU === 'f') celsius = (val - 32) * 5/9;
                else if (inU === 'k') celsius = val - 273.15;

                // Convert from Celsius to target
                let result;
                if (outU === 'c') result = celsius;
                else if (outU === 'f') result = (celsius * 9/5) + 32;
                else if (outU === 'k') result = celsius + 273.15;

                outputVal.value = result.toFixed(2);
            } else {
                // For regular linear conversions using base unit
                const inFactor = units[type][inU].factor;
                const outFactor = units[type][outU].factor;
                const baseValue = val * inFactor;
                const result = baseValue / outFactor;

                // Format output
                outputVal.value = Number.isInteger(result) ? result : parseFloat(result.toFixed(6));
            }
        }

        typeSelect.addEventListener('change', () => populateUnits(typeSelect.value));
        inputUnit.addEventListener('change', calculate);
        outputUnit.addEventListener('change', calculate);
        inputVal.addEventListener('input', calculate);

        // Init
        populateUnits('length');
    </script>
</body>
</html>
