<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جميع الأدوات - Tools DZ</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <header id="main-header">
        <div class="container">
            <div class="logo">
                <a href="../index.html">
                    <h1>Tools DZ</h1>
                </a>
            </div>
            <nav id="main-nav">
                <ul>
                    <li><a href="../index.html">الرئيسية</a></li>
                    <li><a href="categories.html">التصنيفات</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 style="margin: 20px 0;">جميع الأدوات 🛠️</h2>
        <div id="all-tools-container" class="grid-container">
            <p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">جاري تحميل الأدوات...</p>
        </div>
    </main>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/favorites.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('all-tools-container');
            try {
                const res = await fetch(resolveUrl('/data/tools.json'));
                const tools = await res.json();

                container.innerHTML = tools.map(tool => {
                    const isFav = Favorites.isFavorite(tool.id);
                    return `
                    <div class="card tool-card">
                        <div class="card-icon">${tool.icon}</div>
                        <h4>${tool.name}</h4>
                        <p>${tool.description}</p>
                        <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center;">
                            <a href="${resolveUrl(tool.url)}" class="btn">استخدام الأداة</a>
                            <button class="fav-btn" data-id="${tool.id}" title="إضافة للمفضلة" style="background:none; border:none; cursor:pointer; font-size:1.2rem;">${isFav ? '⭐' : '☆'}</button>
                        </div>
                    </div>
                `}).join('');

                container.addEventListener('click', (e) => {
                    if (e.target.closest('.fav-btn')) {
                        const btn = e.target.closest('.fav-btn');
                        const toolId = btn.getAttribute('data-id');
                        const isFav = Favorites.toggle(toolId);
                        btn.textContent = isFav ? '⭐' : '☆';
                    }
                });
            } catch (e) {
                container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--error-color);">حدث خطأ أثناء تحميل البيانات.</p>';
            }
        });
    </script>
</body>
</html>
