<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "حاسبة الوقود والمسافة",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "All"
    }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الوقود والمسافة - Tools DZ</title>
    <meta name="description" content="احسب كمية وتكلفة الوقود لرحلتك القادمة.">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/tools.css">
</head>
<body>
    <header id="main-header">
        <div class="container">
            <div class="logo">
                <a href="../index.html">
                    <h1>Tools DZ</h1>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-page-container">
            <div class="tool-header">
                <h2>حاسبة الوقود ⛽</h2>
                <p>احسب التكلفة وكمية الوقود اللازمة لرحلتك.</p>
            </div>

            <div class="tool-wrapper">
                <form id="fuel-form">
                    <div class="form-group">
                        <label>مسافة الرحلة (كم)</label>
                        <input type="number" id="distance" min="1" required placeholder="مثال: 300">
                    </div>
                    <div class="form-group">
                        <label>استهلاك السيارة (لتر/100كم)</label>
                        <input type="number" id="consumption" min="1" step="0.1" required placeholder="مثال: 6.5">
                    </div>
                    <div class="form-group">
                        <label>نوع الوقود</label>
                        <select id="fuel-type">
                            <option value="45.97">Essence Sans Plomb (45.97 دج)</option>
                            <option value="29.01">Diesel (29.01 دج)</option>
                            <option value="9.00">Sirghaz / GPL (9.00 دج)</option>
                            <option value="custom">إدخال يدوي للسعر</option>
                        </select>
                    </div>
                    <div class="form-group hidden" id="custom-price-group">
                        <label>السعر (دج/لتر)</label>
                        <input type="number" id="custom-price" min="0" step="0.1" value="0">
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">احسب تكلفة الرحلة</button>
                </form>

                <div id="result" class="tool-result hidden text-center">
                    <h3>النتيجة</h3>
                    <p>كمية الوقود المطلوبة: <strong id="liters-needed">0</strong> لتر</p>
                    <p style="font-size: 1.2rem; margin-top: 10px;">التكلفة الإجمالية: <strong id="total-cost" style="color:var(--primary-color);">0</strong> دج</p>
                    <p style="color:var(--text-muted); font-size:0.9rem; margin-top:5px;">تكلفة كل 100 كم: <strong id="cost-per-100">0</strong> دج</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const fuelTypeSelect = document.getElementById('fuel-type');
        const customPriceGroup = document.getElementById('custom-price-group');
        const customPriceInput = document.getElementById('custom-price');

        fuelTypeSelect.addEventListener('change', function() {
            if (this.value === 'custom') {
                customPriceGroup.classList.remove('hidden');
                customPriceInput.required = true;
            } else {
                customPriceGroup.classList.add('hidden');
                customPriceInput.required = false;
            }
        });

        document.getElementById('fuel-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const distance = parseFloat(document.getElementById('distance').value);
            const consumption = parseFloat(document.getElementById('consumption').value);

            let price = parseFloat(fuelTypeSelect.value);
            if (fuelTypeSelect.value === 'custom') {
                price = parseFloat(customPriceInput.value);
            }

            const liters = (distance / 100) * consumption;
            const totalCost = liters * price;
            const costPer100 = consumption * price;

            document.getElementById('liters-needed').textContent = liters.toFixed(1);
            document.getElementById('total-cost').textContent = Math.round(totalCost).toLocaleString();
            document.getElementById('cost-per-100').textContent = Math.round(costPer100).toLocaleString();

            document.getElementById('result').classList.remove('hidden');
        });
    </script>
</body>
</html>
